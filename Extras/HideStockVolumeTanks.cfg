// Removes BDB's "stock volume" Able / Delta tank options (AbleStock, DeltaStock: about twice the real
// propellant load, sized for stock-scale play). The real-volume Able and Delta options stay.
// A saved craft that used one of them falls back to the default (Able) when loaded.

@PART[bluedog_ThorAble_Tank]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameTankSwitch]]
	{
		!SUBTYPE[AbleStock] {}
		!SUBTYPE[DeltaStock] {}
	}
}

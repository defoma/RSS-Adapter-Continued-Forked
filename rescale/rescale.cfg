//parachutes, special case
@PART[*]:HAS[@MODULE[ModuleDragModifier],@MODULE[ModuleParachute],!MODULE[ModuleTagNotRescaled]]
{
	@MODULE,*:HAS[#name[ModuleDragModifier]]
	{
		@dragModifier *= 0.390625 // 1/1.6^2
	}
}
//fairings
@PART[*]:HAS[@MODULE[ModuleProceduralFairing],!MODULE[ModuleTagNotRescaled]]
{
	%rescaleFactor = 1.0

	//adds scale variable when needed to base
	//a potential bug if another MODEL without position is added
    @MODEL,*:HAS[~position[*],~scale[*]]
    {
		%scale = 1.0, 1.0, 1.0
    }
    //increase base size width/length, keep height same for asthetics
    @MODEL,*:HAS[~position[*]]
    {
    	scale0 = #$scale[0]$
	   	scale2 = #$scale[2]$
    	@scale0 *= 1.6
    	@scale2 *= 1.6
    	@scale = #$scale0$,$scale[1]$, $scale2$
    	!scale0 = DEL
    	!scale2 = DEL
    }
	@MODULE[ModuleProceduralFairing]
	{
		@baseRadius *= 1.6
		@maxRadius *= 1.6
		@snapThreshold *= 1.6
		@xSectionHeightMax *= 2
	}
}
//fairing interstage
@PART[*]:HAS[@MODULE[ModuleProceduralFairing],#node_stack_interstage01a[*],!MODULE[ModuleTagNotRescaled]]
{
	//increase autotruss size.  autotruss has a 'position' variable
	//potential bug if another MODEL with position is added
	@MODEL,*:HAS[#position[*]]
	{
		&scale = 1.0, 1.0, 1.0
		@scale[*] *= 1.6
	}

	//stack position height changes just a bit when the model scales asymetrically. (fairing height is not increased.  see above)
	%position_height = #$/MODEL:HAS[#position[*]]/position[1]$
	@position_height /= 1.6

	@node_stack_interstage01a[1] *= 1.6
	@node_stack_interstage01a[1] -= #$position_height$
	@node_stack_interstage01b[1] *= 1.6
	@node_stack_interstage01b[1] -= #$position_height$

	@node_stack_interstage02a[1] *= 1.6
	@node_stack_interstage02a[1] -= #$position_height$
	@node_stack_interstage02b[1] *= 1.6
	@node_stack_interstage02b[1] -= #$position_height$

	@node_stack_interstage03a[1] *= 1.6
	@node_stack_interstage03a[1] -= #$position_height$
	@node_stack_interstage03b[1] *= 1.6
	@node_stack_interstage03b[1] -= #$position_height$

	@node_stack_interstage04a[1] *= 1.6
	@node_stack_interstage04a[1] -= #$position_height$
	@node_stack_interstage04b[1] *= 1.6
	@node_stack_interstage04b[1] -= #$position_height$

	@node_stack_interstage05a[1] *= 1.6
	@node_stack_interstage05a[1] -= #$position_height$
	@node_stack_interstage05b[1] *= 1.6
	@node_stack_interstage05b[1] -= #$position_height$

	@node_stack_interstage06a[1] *= 1.6
	@node_stack_interstage06a[1] -= #$position_height$
	@node_stack_interstage06b[1] *= 1.6
	@node_stack_interstage06b[1] -= #$position_height$
	!position_height = DEL

	@node_stack_top[0] *= 1.6
	@node_stack_top[2] *= 1.6

	@node_stack_bottom[0] *= 1.6
	@node_stack_bottom[2] *= 1.6
}

//Procedural Fairings: the mod builds its meshes and moves its nodes in meters from the diameter typed in,
//so the parts must stay at rescaleFactor 1 (the generic x1.6 above would misplace the nodes and panels).
//Instead the default size, size steps and connect-node radius follow the 1.6x stack sizes (2 / 4 / 6 m),
//and the tech-upgrade size limits grow 1.6x.
@PART[*]:HAS[@MODULE[ProceduralFairing*],!MODULE[ModuleTagNotRescaled]]:NEEDS[ProceduralFairings]:FINAL
{
	@rescaleFactor = 1.0
}
@PART[*]:HAS[@MODULE[ProceduralFairingBase],!MODULE[ModuleTagNotRescaled]]:NEEDS[ProceduralFairings]:FINAL
{
	@MODULE[ProceduralFairingBase]
	{
		@baseSize = 2.0
		%diameterStepLarge = 2.0
		%diameterStepSmall = 0.2
		%minSize = 1.6
		%maxSize = 2.4
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[FairingBaseMin0_4m]]
			{
				@minSize = 0.64
			}
			@UPGRADE:HAS[#name__[FairingBaseMax2_75m]]
			{
				@maxSize = 4.4
			}
			@UPGRADE:HAS[#name__[FairingBaseMax4m]]
			{
				@maxSize = 6.4
			}
			@UPGRADE:HAS[#name__[FairingBaseMax12m]]
			{
				@maxSize = 19.2
			}
			@UPGRADE:HAS[#name__[ThrustPlateMax12m]]
			{
				@maxSize = 19.2
			}
		}
	}
	@MODULE[ProceduralFairingBase]:HAS[#mode[Adapter]]
	{
		@topSize = 2.0
	}
	@MODULE[KzNodeNumberTweaker]:HAS[#radius[0.625]]
	{
		@radius = 1.0
	}
}
@PARTUPGRADE[FairingBaseMin0_4m]:NEEDS[ProceduralFairings]:FINAL
{
	@title = Procedural Fairings Min Diameter 0.64m
	@description = Allows fairings and plates as small as 0.64 meters
}
@PARTUPGRADE[FairingBaseMax2_75m]:NEEDS[ProceduralFairings]:FINAL
{
	@title = Procedural Fairings Max Diameter 4.4m
	@description = Allows fairings and plates up to 4.4m diameter
}
@PARTUPGRADE[FairingBaseMax4m]:NEEDS[ProceduralFairings]:FINAL
{
	@title = Procedural Fairings Max Diameter 6.4m
	@description = Allows fairings and plates up to 6.4m diameter
}
@PARTUPGRADE[FairingBaseMax12m]:NEEDS[ProceduralFairings]:FINAL
{
	@title = Procedural Fairings Max Diameter 19.2m
	@description = Allows fairings up to 19.2m diameter
}
@PARTUPGRADE[ThrustPlateMax12m]:NEEDS[ProceduralFairings]:FINAL
{
	@title = Procedural Fairings Thrust Plate Max Diameter 19.2m
	@description = Allows thrust plates up to 19.2m diameter
}

//variant stack nodes for engines, strutural tubes, engine plates, etc.
@PART[*]:HAS[@MODULE[ModulePartVariants],!MODULE[ModuleTagNotRescaled]]:FINAL
{
	@MODULE[ModulePartVariants]
	{
	   @VARIANT,*
 	   {
 	   		@NODES:HAS[#node_stack_bottom[*]] {
		    	stack_bottom0 = #$node_stack_bottom[0]$
			    stack_bottom1 = #$node_stack_bottom[1]$
    			stack_bottom2 = #$node_stack_bottom[2]$
		    	@stack_bottom0 *= 1.6
	    		@stack_bottom1 *= 1.6
		    	@stack_bottom2 *= 1.6
	    		@node_stack_bottom = #$stack_bottom0$,$stack_bottom1$,$stack_bottom2$,$node_stack_bottom[3]$,$node_stack_bottom[4]$,$node_stack_bottom[5]$,$node_stack_bottom[6]$
	    		!stack_bottom0 = DEL
			    !stack_bottom1 = DEL
    			!stack_bottom2 = DEL
	    	}
 	   		@NODES:HAS[#node_stack_top[*]] {
		    	stack_top0 = #$node_stack_top[0]$
			    stack_top1 = #$node_stack_top[1]$
    			stack_top2 = #$node_stack_top[2]$
		    	@stack_top0 *= 1.6
	    		@stack_top1 *= 1.6
		    	@stack_top2 *= 1.6
	    		@node_stack_top= #$stack_top0$,$stack_top1$,$stack_top2$,$node_stack_top[3]$,$node_stack_top[4]$,$node_stack_top[5]$,$node_stack_top[6]$
	    		!stack_top0 = DEL
			    !stack_top1 = DEL
    			!stack_top2 = DEL
	    	}
 	   		@NODES:HAS[#node_stack_bottom1[*]] {
		    	stack_bottom10 = #$node_stack_bottom1[0]$
			    stack_bottom11 = #$node_stack_bottom1[1]$
    			stack_bottom12 = #$node_stack_bottom1[2]$
		    	@stack_bottom10 *= 1.6
	    		@stack_bottom11 *= 1.6
		    	@stack_bottom12 *= 1.6
	    		@node_stack_bottom1 = #$stack_bottom10$,$stack_bottom11$,$stack_bottom12$,$node_stack_bottom1[3]$,$node_stack_bottom1[4]$,$node_stack_bottom1[5]$,$node_stack_bottom1[6]$
	    		!stack_bottom10 = DEL
			    !stack_bottom11 = DEL
    			!stack_bottom12 = DEL
	    	}
 	   		@NODES:HAS[#node_stack_bottom2[*]] {
		    	stack_bottom20 = #$node_stack_bottom2[0]$
			    stack_bottom21 = #$node_stack_bottom2[1]$
    			stack_bottom22 = #$node_stack_bottom2[2]$
		    	@stack_bottom20 *= 1.6
	    		@stack_bottom21 *= 1.6
		    	@stack_bottom22 *= 1.6
	    		@node_stack_bottom2 = #$stack_bottom20$,$stack_bottom21$,$stack_bottom22$,$node_stack_bottom2[3]$,$node_stack_bottom2[4]$,$node_stack_bottom2[5]$,$node_stack_bottom2[6]$
	    		!stack_bottom20 = DEL
			    !stack_bottom21 = DEL
    			!stack_bottom22 = DEL
	    	}
 	   		@NODES:HAS[#node_attach[*]] {
		    	attach0 = #$node_attach[0]$
			    attach1 = #$node_attach[1]$
    			attach2 = #$node_attach[2]$
		    	@attach0 *= 1.6
	    		@attach1 *= 1.6
		    	@attach2 *= 1.6
	    		@node_attach = #$attach0$,$attach1$,$attach2$,$node_attach[3]$,$node_attach[4]$,$node_attach[5]$,$node_attach[6]$
	    		!attach0 = DEL
			    !attach1 = DEL
    			!attach2 = DEL
	    	}
	    }
	}
}


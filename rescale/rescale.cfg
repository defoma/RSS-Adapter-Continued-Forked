//part rescaling
@PART[*]:HAS[#rescaleFactor[*],!MODULE[ModuleTagNotRescaled]]:FINAL
{
	@rescaleFactor *= 1.6
}
@PART[*]:HAS[~rescaleFactor[],!MODULE[ModuleTagNotRescaled]]:FINAL
{
	%rescaleFactor = 2.0
}
@PART[*]:HAS[~scale[],!MODULE[ModuleTagNotRescaled]]
{
	%scale = 1.0
}
@PART[*]:FINAL
{
    !rescaleFactor,1 = DEL
}

@PART[*]:HAS[@MODULE[TweakScale]]:NEEDS[TweakScale]:FINAL
{
	@MODULE[TweakScale]
	{
		@defaultScale *= 1.6
	}
}
@SCALETYPE[stack]:NEEDS[TweakScale]:FINAL
{
	@defaultScale *= 1.6
	@scaleFactors[*] *= 1.6
}
@SCALETYPE[stack_square]:NEEDS[TweakScale]:FINAL
{
	@defaultScale *= 1.6
	@scaleFactors[*] *= 1.6
}

//eva reach
@PART[*]:HAS[@MODULE[ModuleScienceExperiment]]:FINAL
{
	@MODULE,*:HAS[#name[ModuleScienceExperiment],#interactionRange[*]] { @interactionRange *= 1.6 }
	@MODULE,*:HAS[#name[ModuleScienceExperiment],~interactionRange[]] { interactionRange = 1.92 }
}
@PART[*]:HAS[@MODULE[DMModuleScienceAnimateGeneric]]:FINAL
{
	@MODULE,*:HAS[#name[DMModuleScienceAnimateGeneric],#interactionRange[*]] { @interactionRange *= 1.6 }
}
@PART[*]:HAS[@MODULE[ModuleScienceContainer]]:FINAL
{
	@MODULE,*:HAS[#name[ModuleScienceContainer],#storageRange[*]] { @storageRange *= 1.6 }
	@MODULE,*:HAS[#name[ModuleScienceContainer],~storageRange[]] { storageRange = 2.08 }
}
@PART[*]:HAS[@MODULE[ModuleScienceLab]]:FINAL
{
	@MODULE,*:HAS[#name[ModuleScienceLab],#interactionRange[*]] { @interactionRange *= 1.6 }
}
@PART[*]:HAS[@MODULE[ModuleAnimateGeneric]:HAS[#evaDistance[*]]]:FINAL
{
	@MODULE,*:HAS[#name[ModuleAnimateGeneric],#evaDistance[*]] { @evaDistance *= 1.6 }
}
@PART[*]:HAS[@MODULE[ModuleColorChanger]:HAS[#unfocusedRange[*]]]:FINAL
{
	@MODULE,*:HAS[#name[ModuleColorChanger],#unfocusedRange[*]] { @unfocusedRange *= 1.6 }
}
@PART[*]:HAS[@MODULE[KerbalEVA]]:FINAL
{
	@MODULE[KerbalEVA] { @clamberReach *= 1.6 }
}

//iva scaling
@INTERNAL[*]
{
	@MODEL,*
	{
		%scale = 1, 1, 1
		@scale[*] *= 1.6
	}
	@PROP,*
	{
		@position[*] *= 1.6
		@scale[*] *= 1.6
	}
	@MODULE[InternalSeat],*
	{
		&kerbalScale = 1, 1, 1
		@kerbalScale[*] *= 1.6
	}
}

//Waterfall and plumes
@PART[*]:HAS[@MODULE[ModuleWaterfallFX],!MODULE[ModuleTagNotRescaled]]:NEEDS[Waterfall]:FINAL
{
	@MODULE[ModuleWaterfallFX],*
	{
		@TEMPLATE,*
		{
			&scale = 1,1,1
			@scale[0] *= 1.6
			@scale[1] *= 1.6
			@scale[2] *= 1.6
		}
	}
}
@PART[*]:HAS[@MODULE[ModuleWaterfallFX],@MODULE[ModuleB9PartSwitch],!MODULE[ModuleTagNotRescaled]]:NEEDS[Waterfall,B9PartSwitch]:FINAL
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			@MODULE,*
			{
				@DATA,*
				{
					@TEMPLATE,*
					{
						&scale = 1,1,1
						@scale[0] *= 1.6
						@scale[1] *= 1.6
						@scale[2] *= 1.6
					}
				}
			}
		}
	}
}
@PART[*]:HAS[@EFFECTS,!MODULE[ModuleTagNotRescaled]]:FINAL
{
	@EFFECTS
	{
		@*,*
		{
			@MODEL_MULTI_PARTICLE,*
			{
				&localScale = 1,1,1
				@localScale[0] *= 1.6
				@localScale[1] *= 1.6
				@localScale[2] *= 1.6
			}
		}
	}
}

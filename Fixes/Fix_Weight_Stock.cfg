// Kerbal EVA inventory: stock 65 kg / 40 L was sized for the stock item masses. With the masses above, the
// default loadout (jetpack 40 kg + 25 kg EVA Propellant, parachute 8 kg = 73 kg) is already over the limit.
// 150 kg / 80 L: the default loadout plus a tool kit, experiment kit and a small part or two, roughly what a
// suited astronaut handles on EVA (ISS ORUs ~100+ kg, a large backpack ~80 L).
@PART[*]:HAS[@MODULE[KerbalEVA],@MODULE[ModuleInventoryPart]]:FINAL
{
	@MODULE[ModuleInventoryPart]
	{
		@massLimit = 0.15 // was 0.065
		@packedVolumeLimit = 80 // was 40
	}
}

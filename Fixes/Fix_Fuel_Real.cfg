// Delta IV 5 m DCSS: one patch for either copy of the part. Benjee10_Orion ships its own copy
// when BDB is absent (fuel switch ~2703 VU); with BDB installed BDB's part is used (3600 VU).
// The volume is set outright to hold 27.22 t at real hydrolox density, and the fuel-switch
// addedMass is scaled by the same ratio so the dry mass does not change.
@PART[bluedog_DeltaIV_DCSS_5m]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]]:FINAL // Delta IV 5 m DCSS: 27.22 t; 'SLS ICPS' length variant: 28.95 t
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		dcssScale = 3678.36
		@dcssScale /= #$baseVolume$
		@baseVolume = 3678.36
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= #$../dcssScale$ }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLength]]
	{
		@SUBTYPE[Double] { @volumeAddedToParent = 234 }
	}
}
// (MM applies value edits before node edits, so the helper key is removed in a second pass)
@PART[bluedog_DeltaIV_DCSS_5m]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#dcssScale]]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#dcssScale] { !dcssScale = DEL }
}


@PART[oranges_ET_STS]:NEEDS[ORANGES]:FINAL // Shuttle ET: 735.6 t hydrolox
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 1.0991
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 1.0991 }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLength]]
	{
		@SUBTYPE,*:HAS[#volumeAddedToParent[*]] { @volumeAddedToParent *= 1.0991 }
	}
}

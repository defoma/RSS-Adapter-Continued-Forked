//Attach rules
@PART[*]:FINAL { @attachRules = 1,1,1,1,0 }

//Increasing servo strength to compensate for the weight change
@PART[*]:HAS[@MODULE[ModuleRoboticServoRotor]]
{
	@MODULE[ModuleRoboticServoRotor]
	{
		@maxMotorOutput *= 4
	}
}

//tanks and resources
@PART[*]
{
	@RESOURCE[IntakeAir]
	{
		@amount *= 4
		@maxAmount *= 4
	}
	@RESOURCE[ElectricCharge]
	{
		@amount *= 12
		@maxAmount *= 12
	}
}

// decrease resource costs
@RESOURCE_DEFINITION[*]
{
	@unitCost *= 0.6
}

// Fuel tanks, lower dry mass but larger volume
@PART[*]:HAS[@RESOURCE[LiquidFuel],!MODULE[ModuleB9PartSwitch],!MODULE[ModuleCommand],!MODULE[ModuleEngines*],!MODULE[ModuleTagNotRescaled]]
{
	@mass *= 1.6
}
@PART[*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]],!MODULE[ModuleCommand],!MODULE[ModuleEngines*],!MODULE[ModuleTagNotRescaled]]
{
	@mass *= 1.6
}

//fairings: panel areal density and cost (the panel area itself grows with rescale.cfg).
// 10 kg/m^2: the Falcon 9 fairing is about 2 t (two ~1 t halves) over roughly 170-200 m^2 (est.)
@PART[*]:HAS[@MODULE[ModuleProceduralFairing],!MODULE[ModuleTagNotRescaled]]
{
	@MODULE[ModuleProceduralFairing]
	{
		@UnitAreaMass = 0.010
		@UnitAreaCost = 6
	}
}

// Intakes: area for 1.6x the size
@PART[*]:HAS[@MODULE[ModuleResourceIntake],!MODULE[ModuleTagNotRescaled]]:FOR[zLRTR]
{
	//@mass *= 2.56
	@MODULE[ModuleResourceIntake]
	{
		@area *= 2.56
	}
}

//Lift
@PART[*]:HAS[@MODULE[*]:HAS[#deflectionLiftCoeff[*]],!MODULE[ModuleTagNotRescaled]]:FINAL
{
	@MODULE,*:HAS[#deflectionLiftCoeff[*]]
	{
		@deflectionLiftCoeff *= 2.56
	}
}

// Wings (Aero category): near-zero body drag
@PART[*]:HAS[@MODULE[ModuleLiftingSurface],#category[Aero]]:FINAL
{
	@maximum_drag = 0.00002
	@minimum_drag = 0.00002
}

{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_Fuel]] { @baseVolume = 19554.7 } // was 22400 (471 t)
}

@PART[TE_19_F9_S2_Tank]:NEEDS[TundraExploration,B9PartSwitch]:AFTER[TundraExploration] // 107.5 t (75.2 t LOX + 32.3 t RP-1)
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_Fuel]] { @baseVolume = 5114.7 } // was 5200 (109 t)
}


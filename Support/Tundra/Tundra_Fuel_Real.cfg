}

@PART[TE_19_F910_S2_Tank]:NEEDS[TundraExploration,B9PartSwitch]:AFTER[TundraExploration] // ~45.8 t: Merlin 1C Vacuum for 345 s
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_Fuel]] { @baseVolume = 2177.9 } // was 2700 (56.7 t)
}


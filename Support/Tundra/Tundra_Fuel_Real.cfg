// ---- Dragon propellant -----------------------------------------------------------
// Real Dragons carry MMH/NTO, so the tanks hold the Adapter's AZ50/NTO (24.35 kg/VU).

@PART[TE_18_DRAGONV2_POD,TE_18_DRAGONV2_POD_I4]:NEEDS[TundraExploration,B9PartSwitch]:AFTER[TundraExploration] // Crew Dragon: 2,562 kg
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_VolumeBias]]
	{
		@baseVolume = 105.2 // was 130 MonoPropellant
		@SUBTYPE[Default] { @tankType = AZ50NTO }
		@SUBTYPE[Extra] // Tundra's +50%
		{
			@tankType = AZ50NTO
			@volumeAdded = 52.6
			@volumeAddedToParent = -52.6
			@descriptionSummary = Kaijuu Goods capacity reduced. Propellant capacity increased by 50%.
		}
	}
}

@PART[TE_20_CargoRodan]:NEEDS[TundraExploration,B9PartSwitch]:AFTER[TundraExploration] // Cargo Dragon 2: same tanks as Crew Dragon
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_VolumeBias]]
	{
		@baseVolume = 105.2 // was 130 MonoPropellant
		@SUBTYPE[Default] { @tankType = AZ50NTO }
		@SUBTYPE[Extra] // Tundra's +100%
		{
			@tankType = AZ50NTO
			@volumeAdded = 105.2
			@volumeAddedToParent = -105.2
			@descriptionSummary = Kaijuu Goods capacity reduced. Propellant capacity doubled.
		}
	}
}

@PART[TE_19_C-Dragon_Pod]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Dragon 1: ~1,290 kg MMH/NTO, which Tundra's pod lacked
{
	RESOURCE
	{
		name = Aerozine50
		amount = 26.39
		maxAmount = 26.39
	}
	RESOURCE
	{
		name = NTO
		amount = 32.25
		maxAmount = 32.25
	}
}

@PART[DragonFuelTank]:NEEDS[KerbalReusabilityExpansion]:AFTER[KerbalReusabilityExpansion] // KRE Dragon tank: Crew Dragon's 2,562 kg
{
	@tags ^= :lfo:mmh nto aerozine:
	!RESOURCE,* {}
	RESOURCE
	{
		name = Aerozine50
		amount = 52.4
		maxAmount = 52.4
	}
	RESOURCE
	{
		name = NTO
		amount = 64.05
		maxAmount = 64.05
	}
}

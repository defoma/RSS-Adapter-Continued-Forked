
// ---- Ghidorah 9 = Falcon 9 Block 5 -------------------------------------------

@PART[TE_19_F9_S1_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // 9x Merlin 1D: 845 kN SL / 914 kN vac each, 311/282 s
{
	%real_title = Falcon 9 Octaweb (9x Merlin 1D)
	%real_description = The Block 5 first-stage engine section: nine Merlin 1D engines in the Octaweb, 7,607 kN at sea level. Switch to three or one engine for boostback and landing burns.
	@mass = 5.53 // 9x 470 kg + ~1.3 t Octaweb (est.) (was 9.4)
	@MODULE[ModuleEnginesFX]:HAS[#engineID[AllEngines]] { @maxThrust = 8227 } // 9 engines
	@MODULE[ModuleEnginesFX]:HAS[#engineID[ThreeLanding]] { @maxThrust = 2742.3 } // 3 engines (was 1706)
	@MODULE[ModuleEnginesFX]:HAS[#engineID[CenterOnly]] { @maxThrust = 914.1 } // centre engine (was 764)
}

@PART[TE2_19_F9_Merlin_1D]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Merlin 1D: 914 kN vac, 311/282 s, 470 kg
{
	%real_title = Merlin 1D
	%real_description = SpaceX's gas-generator kerolox engine: 845 kN at sea level, 914 kN in vacuum, 282/311 s, from a 470 kg engine.
	@mass = 0.47 // was 1
	@MODULE[ModuleEnginesFX] { @maxThrust = 914.1 } // was 250
}

@PART[TE_19_F9_S1_Octaweb]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Octaweb without engines
{
	%real_title = Falcon 9 Octaweb Structure
	%real_description = The Octaweb thrust structure without engines. Fit nine Merlin 1Ds to build the first-stage engine section.
	@mass = 1.3 // est., so Octaweb + 9 Merlin 1D = the Octopus (was 0.4)
}

@PART[TE_19_F9_S2_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Merlin Vacuum: 981 kN, 348 s
{
	%real_title = Merlin Vacuum (MVac)
	%real_description = The Falcon 9 upper-stage engine: 981 kN at 348 s with the full niobium nozzle extension, or 840 kN with the short nozzle flown since 2023.
	@mass = 0.6 // est. (Merlin 1D 470 kg + niobium nozzle extension) (was 4.2)
	@MODULE[ModuleEnginesFX] { @maxThrust = 981 } // was 580
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[TE_MVAC]]
	{
		@SUBTYPE[MVAC_1]
		{
			@descriptionDetail = <b>Max Thrust</b>: 981 kN (Vac) <br><b>Isp</b>: 348 s (Vac) <br><b>Alternator</b>: 10 EC/s
		}
		@SUBTYPE[MVAC_2] // short nozzle flown since Transporter-7: 840 kN
		{
			@addedMass = -0.1 // est. (was -0.26)
			@descriptionDetail = <b>Max Thrust</b>: <color="yellow">840</color> kN (Vac) <br><b>Isp</b>: <color="yellow">338</color> s (Vac) <br><b>Alternator</b>: <color="yellow">7.8</color> EC/s
			@MODULE:HAS[@IDENTIFIER[ModuleEnginesFX]]
			{
				@DATA { @maxThrust = 840 } // was 580
			}
		}
	}
}

// ---- Bagorah 9 = Falcon 9 v1.0 ------------------------------------------------

@PART[TE_19_F910_S1_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // 9x Merlin 1C: 420 kN SL / 480 kN vac each, 304.8/275 s, 630 kg
{
	%real_title = Falcon 9 v1.0 Engine Section (9x Merlin 1C)
	%real_description = The nine Merlin 1C engines of Falcon 9 v1.0: 420 kN at sea level and 480 kN in vacuum each, 275/304.8 s.
	@mass = 6.97 // 9x 630 kg + ~1.3 t thrust structure (est.) (was 9.4)
	@MODULE[ModuleEnginesFX] { @maxThrust = 4320 } // was 1600
}

@PART[TE_19_F910_S2_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Merlin 1C Vacuum: 445 kN, 342 s
{
	%real_title = Merlin 1C Vacuum
	%real_description = The Falcon 9 v1.0 upper-stage engine: 445 kN at 342 s.
	@mass = 0.9 // engine ~0.6 t (est.) + the 0.3 t jettisoned interstage (was 3.4)
	@MODULE[ModuleEnginesFX] { @maxThrust = 445 } // was 352
}

// ---- Mothra = Falcon 1 ----------------------------------------------------------

@PART[TE_F1_S1_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Merlin 1C (Falcon 1): 350 kN SL / 400 kN vac, 304 s vac
{
	%real_title = Merlin 1C (Falcon 1)
	%real_description = The regeneratively cooled Merlin 1C that put Falcon 1 into orbit in 2008: 350 kN at sea level, 400 kN in vacuum.
	@mass = 0.63 // was 0.9
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 400 // was 198
		@atmosphereCurve
		{
			@key,0 = 0 304 // was 303
			@key,1 = 1 266 // 304 x 350/400 (was 261)
		}
	}
}

@PART[TE_F1_S2_Engine]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Kestrel: 31 kN, 317 s, 52 kg + the stage's cold-gas RCS
{
	%real_title = Kestrel
	%real_description = Falcon 1's pressure-fed upper-stage engine: 31 kN at 317 s from 52 kg, with the stage's cold-gas thrusters.
	@mass = 0.12 // was 0.2
	@MODULE[ModuleEnginesFX] { @maxThrust = 31 } // was 26
	@RESOURCE[MonoPropellant]
	{
		@amount = 9
		@maxAmount = 9
	}
}

// ---- Dragon thrusters -----------------------------------------------------------

@PART[TE_18_DRAGONV2_POD,TE_18_DRAGONV2_POD_I4]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Crew Dragon: 8x SuperDraco (71 kN SL / 73 kN vac) + Draco RCS
{
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 584 // 8x 73 kN (was 228)
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Aerozine50
			ratio = 0.9
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 1.1
		}
		@atmosphereCurve
		{
			@key,0 = 0 247 // ~240 s SL x 73/71 (est.) (was 305)
			@key,1 = 1 240 // est. from thrust and flow (was 290)
		}
	}
}

@PART[TE_19_C-Dragon_Pod,TE_18_DRAGONV2_POD,TE_18_DRAGONV2_POD_I4,TE_20_CargoRodan]:NEEDS[TundraExploration]:AFTER[TundraExploration] // Draco: 400 N, 300 s
{
	@MODULE[ModuleRCSFX],*
	{
		@thrusterPower = 0.4 // per nozzle (was 0.3-1.5)
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Aerozine50
			ratio = 0.45
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.55
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		@atmosphereCurve
		{
			@key,0 = 0 300 // was 240
		}
	}
}

// ---- Kerbal Reusability Expansion: SuperDraco pods ------------------------------
// One KRE pod is one of Crew Dragon's four SuperDraco pairs.

@PART[SmallCapsuleEngine,SmallCapsuleEngineRCS]:NEEDS[KerbalReusabilityExpansion]:AFTER[KerbalReusabilityExpansion] // 2x SuperDraco: 2x 73 kN vac
{
	@MODULE[ModuleEnginesFX]
	{
		@maxThrust = 146 // was 90
		@PROPELLANT[LiquidFuel] { @name = Aerozine50 }
		@PROPELLANT[Oxidizer] { @name = NTO }
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 247 // est. (was 270)
			key = 1 240 // est. (was 240)
			key = 7 0.001
		}
	}
}

@PART[SmallCapsuleEngineRCS]:NEEDS[KerbalReusabilityExpansion]:AFTER[KerbalReusabilityExpansion] // Draco: 400 N, 300 s
{
	@MODULE[ModuleRCSFX]
	{
		!PROPELLANT,* {}
		PROPELLANT
		{
			name = Aerozine50
			ratio = 0.45
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.55
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		@atmosphereCurve
		{
			@key,0 = 0 300 // was 240
		}
	}
}



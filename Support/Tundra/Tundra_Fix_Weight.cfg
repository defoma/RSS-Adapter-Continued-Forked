// Fix_Weight 

@PART[TT_19_NH_RCS_3,TT_19_NH_RCS_4,TT_19_NH_RCS_1,TT_19_NH_RCS_2]
{
	@mass = 0.01
}

@PART[TE_19_C_Dragon_Decoupler]
{
	@mass = 0.06
}

@PART[Grid*]
{
	@mass *= 0.5
}

@PART[TE_19_C-Dragon_Trunk]
{
	@mass = 0.15
}

@PART[TE_19_F9_S1_Interstage]
{
	@mass = 0.2
}

@PART[TE2_19_F9_CGT,HotGasThruster-L,HotGasThruster-M,TE_21_DXL_RCS]
{
	@mass = 0.35
}

@PART[TT_G1_Thuster,TT_G1_RCS]
{
	@mass = 0.45
}

//Real masses

// Falcon 9 Block 5 first stage: 25.6 t dry with legs and grid fins =
// Octopus 5.53 + interstage 0.2 + 4 KRE legs 2.2 + 4 titanium grid fins 1.4 + tank 13.83 + B9 2.44
@PART[TE_19_F9_S1_Tank]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 13.83 } // was 11.2

// Falcon 9 second stage: 4.0 t dry = MVac 0.6 + tank 2.76 + B9 0.64
@PART[TE_19_F9_S2_Tank]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 2.76 } // was 2.6

// Falcon 1 first stage: 1,360 kg dry = Merlin 1C 0.63 + tank 0.60 + B9 0.13
@PART[TE_F1_S1_Tank]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 0.6 } // was 0.8

// Falcon 9 payload fairing: about 1.9 t for the 13.1 m fairing; the 18.6 m extended fairing is scaled (est.)
@PART[TE_19_F9_Fairing]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 0.95 } // half (was 0.2)
@PART[TE_21_F9_Extended_Fairing]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 1.25 } // half, est. (was 0.24)

// Dragon 1: 4,201 kg capsule dry = pod 2.8 + PICA-X shield 0.6 + 0.8 t ablator
@PART[TE_19_C-Dragon_Pod]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 2.8 } // was 0.828

// Crew Dragon: 7,700 kg dry with trunk = pod 5.0 + PICA-3 shield 0.64 + 0.4 t ablator + chutes 0.08 + trunk 1.6
// (the pod/trunk split is est.)
@PART[TE_18_DRAGONV2_POD,TE_18_DRAGONV2_POD_I4]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 5.0 } // was 3.4
@PART[TE_18_DRAGONV2_TRUNK]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 1.6 } // est. (was 0.5)

// Cargo Dragon 2: Crew Dragon without SuperDracos, seats and life-support hardware (est.)
@PART[TE_20_CargoRodan]:NEEDS[TundraExploration]:AFTER[TundraExploration] { @mass = 4.6 } // was 0.9

// ---- Atlas family: real stage loads and dry masses -----------------------------------
// Dry masses here are jettison weights (structure + unusable residuals), so burnout masses match.
// SLV-3: Wikipedia (booster jettison 3,342 kg, sustainer 2,980 kg, 111.8 t propellant).
// SLV-3C: AC-13/14 postflight weight summary (NTRS 19700011207): booster 3,376 kg, sustainer 3,060 kg, 121.7 t.
// Atlas I/II/III, Atlas V, Centaur II/III: Isakowitz stage tables (braeunig.us).
// Sustainer section: core + forward tank + aft tank + LR105 + verniers.
@PART[bluedog_atlas_coreTank]:NEEDS[Bluedog_DB]:FINAL { @mass += 1.10 } // SLV-3 sustainer section 2.75 t
@PART[bluedog_atlas_extensionTanks]:NEEDS[Bluedog_DB]:FINAL // stretched forward tank; stretch-specific structure on each size
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchSize]]
	{
		@SUBTYPE[SLV-3C] // 121.7 t, sustainer 3.06 t
		{
			@volumeAddedToParent = 633.2
			%addedMass = 0.16
		}
		@SUBTYPE[Atlas?I] // 137.5 t, sustainer 4.24 t
		{
			@volumeAddedToParent = 1385.8
			%addedMass = 1.147
		}
		@SUBTYPE[Atlas?II] // 156.3 t, sustainer 6.10 t
		{
			@volumeAddedToParent = 2277.0
			%addedMass = 2.827
		}
		@SUBTYPE[Atlas?III] // 183.2 t with the core alone (no aft tank), stage 13.7 t with RD-180
		{
			@volumeAddedToParent = 4137.0
			%addedMass = 5.085
		}
	}
}
// Booster section: 1.93 t skirt + two 0.71 t LR89 (3.35 t, SLV-3 / SLV-3C); RS-56 adds mass in BDB_Engines.cfg.
@PART[bluedog_atlas_boosterSkirt]:NEEDS[Bluedog_DB]:FINAL { @mass = 1.93 }
// Centaur II/III common tank: Centaur IIA 1,840 kg / 16.93 t, Centaur III SEC 1,930 kg / 20.83 t
// (stage dry includes the Centaur D avionics 0.255 t, engine mount 0.125 t and RL10s).
// Isakowitz lists hardware dry and loaded propellant, so 0.45 t of residuals (AC-15 Centaur D: 529 kg)
// is moved from the load into dry mass: IIA 2.29 t / 16.48 t usable, III SEC 2.38 t / 20.38 t usable.
@PART[bluedog_CentaurIII_FuelTank]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume = 2227.0
		@SUBTYPE[LH2/O] { @addedMass = 0.503 } // tank 1.62 t
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLength]]
	{
		@SUBTYPE[Centaur?III] // tank 1.84 t
		{
			@volumeAddedToParent = 527.1
			%addedMass = 0.088
		}
	}
}
// Atlas V Common Core Booster: 20,743 kg dry with the RD-180 (5.48 t)
@PART[bluedog_AtlasV_CCB_upper]:NEEDS[Bluedog_DB]:FINAL { @mass += 4.21 }
@PART[bluedog_AtlasV_CCB_lower]:NEEDS[Bluedog_DB]:FINAL { @mass += 2.93 }

// ---- Thor / Delta family: real stage loads and dry masses ----------------------------
// Reference stage data: Encyclopedia Astronautica (Thor DM-19/DM-21/TA/LT/ELT/XLT, Delta A/D/E/P/K),
// Wikipedia (Delta II, Delta IV), Betts' Delta III example (first stage incl. interstage).
// Kerolox at 21.018 kg/VU. Thor first stage dry includes the engine section, LR79 and verniers:
//   DM-19/DM-21/TA: lower Long + 1.25 m adapter (Long) = 46.0 t, 3.05 t dry
//   Long Tank Thor: lower Long + upper Long = 66.6 t, 3.72 t dry
//   ELT Thor: lower Extended + upper Long = 80.0 t, 4.19 t dry (MB-3 4.06, RS-27 4.36)
//   XLT Thor (Delta II): both Extra Extended = 96.0 t, 5.68 t dry
//   Delta III: lower Delta 3 + 4 m adapter tank = 95.6 t, 8.83 t dry with the DCSS interstage
@PART[bluedog_Thor_LowerTank_1]:NEEDS[Bluedog_DB]:FINAL
{

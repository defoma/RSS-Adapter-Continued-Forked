@PART[bluedog_Vanguard_S1_Tank]:NEEDS[Bluedog_DB]:FINAL // Vanguard first stage: 7.2 t kerosene/LOX (x0.699); wider variant alike
{
	@mass = 0.712 // stage dry 0.94 t = 0.712 tank + 0.034 interstage + 0.194 X-405 (RO RN Vanguard; was 0.307)
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 0.6991
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 0.6991 }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[volumeSwitch]]
	{
		@SUBTYPE,*:HAS[#volumeAddedToParent[*]] { @volumeAddedToParent *= 0.6991 }
	}
}
@PART[bluedog_Vanguard_S2_Tank]:NEEDS[Bluedog_DB]:FINAL // Vanguard second stage: 1.46 t AZ50/NTO by default (real 1.57 t UDMH/IWFNA, 115 s on the AJ10-37)
{
	@mass = 0.17 // stage dry 0.40 t = 0.17 tank + 0.09 guidance + 0.084 AJ10-37 + 56 kg RCS mono (RO RN Vanguard; was 0.041)
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[AZ50NTO]
		{
			%defaultSubtypePriority = 1
			%RESOURCE // integrated RCS, as in BDB_RCS.cfg
			{
				name = MonoPropellant
				unitsPerVolume = 0.0625
				percentFilled = 100
			}
		}
	}
}

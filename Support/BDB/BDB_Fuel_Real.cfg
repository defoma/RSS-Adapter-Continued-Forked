// ---- Titan upper stages -----------------------------------------------------------------
@PART[bluedog_Titan_Transtage]:NEEDS[Bluedog_DB]:FINAL // Transtage: 12.25 t gross, 10.27 t AZ50/NTO (440 s on 2x AJ10-138), 1.98 t dry with RCS
{
	@mass = 1.8637
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@baseVolume = 421.7
		@SUBTYPE[Transtage] { @tankType = AZ50NTO }
		@SUBTYPE[Transtage-34D]
		{
			@tankType = AZ50NTO
			@volumeAdded = 0 // same tanks as the Titan III Transtage (BDB had +45)
			@addedMass = 0
		}
	}
}

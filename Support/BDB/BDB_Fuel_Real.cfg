// ---- 2) Stages and spacecraft copying real hardware ----------------------------------
// Saturn V S-IC: ~2,100 t RP-1/LOX (1,311 m^3 LOX + 770 m^3 RP-1, as loaded). Length variants alike.
@PART[bluedog_Saturn_S1C_Tank]:NEEDS[Bluedog_DB]:FINAL // S-IC: 2,100 t (x1.156)
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 1.1565
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 1.1565 }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLength]]
	{
		@SUBTYPE,*:HAS[#volumeAddedToParent[*]] { @volumeAddedToParent *= 1.1565 }
	}
}

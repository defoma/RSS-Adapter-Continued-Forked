// ---- Titan family: real stage loads and dry masses -----------------------------------
// Reference stage data: RO RaiderNick/FASA Titan configs and Wikipedia (Titan II ICBM).
// Stage 1 dry includes the engine interstage and the LR87:
// Titan II 4.32 t, 23-series Titan III 6.92 t, 34-series 7.7 t, Titan IV 8.64 t.
// Propellant at AZ50/NTO density (24.35 kg/VU): 117.7 / 132.7 / 154.8 t. Titan I kerolox: 75 t.
// Masses are set per tank variant, for the AZ50+NTO subtype (now the default on Titan II+ tanks).
@PART[bluedog_Titan_S1_UpperTank]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameMeshSwitchTank]]
	{
		@SUBTYPE[Titan1] { %volumeAddedToParent = 391.7 } // 2091.7 VU
		@SUBTYPE[Titan2] // 2699.7 VU, 1.364 t
		{
			@volumeAddedToParent = 999.7
			%addedMass = 0.261
		}
		@SUBTYPE[Titan3] // 3315.5 VU, 2.106 t
		{
			@volumeAddedToParent = 1615.5
			%addedMass = 0.994
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[AZ50NTO] { %defaultSubtypePriority = 1 }
	}
}
@PART[bluedog_Titan_S1_LowerTank]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameMeshSwitchTank]]
	{
		@SUBTYPE[Titan1] { %volumeAddedToParent = 276.5 } // 1476.5 VU
		@SUBTYPE[Titan2] // 2133.7 VU, 1.078 t
		{
			@volumeAddedToParent = 933.7
			%addedMass = 0.296
		}
		@SUBTYPE[Titan4] // 3041.3 VU, 2.018 t
		{
			@volumeAddedToParent = 1841.3
			%addedMass = 1.222
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[AZ50NTO] { %defaultSubtypePriority = 1 }
	}
}
// Titan III/IV cores were heavier than Titan II's: the extra 2.6 t of SRB-load structure sits
// on the "Titan 3" interstage options (every Titan III/IV craft uses them; Titan II uses "Titan 2")
@PART[bluedog_Titan2_S2_EngineInterstage]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchFairing]]
	{
		@SUBTYPE[Titan?3] { @addedMass = 2.8 }
		@SUBTYPE[Titan?3??Stretched?] { @addedMass = 2.8 }
	}
}
// Stage 2 dry incl. LR91: Titan II 2.30 t, Titan III 2.55 t, Titan IV 4.37 t; 26.1 / 30.66 / 34.65 t AZ50/NTO
@PART[bluedog_Titan_S2_Tank]:NEEDS[Bluedog_DB]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameMeshSwitchTank]]
	{
		@SUBTYPE[Titan2] // 1071.8 VU, 1.80 t
		{
			%volumeAddedToParent = -88.2
			%addedMass = 1.059
		}
		@SUBTYPE[Titan3] // 1259 VU, 1.96 t
		{
			%volumeAddedToParent = 99
			%addedMass = 1.216
		}
		@SUBTYPE[Titan4] // 1422.9 VU, 3.78 t
		{
			@volumeAddedToParent = 262.9
			%addedMass = 3.034
		}
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[AZ50NTO] { %defaultSubtypePriority = 1 }
	}
}
@PART[bluedog_Titan1_S2_Tank]:NEEDS[Bluedog_DB]:FINAL // Titan I stage 2: 18.3 t kerosene/LOX (155 s on the LR91-3)

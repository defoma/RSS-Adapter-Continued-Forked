// Redstone: 347 kN at 215 s for 121 s = 19.9 t alcohol/LOX; the stretched Juno length (Mercury-Redstone, Jupiter-C) 143.5 s = 23.6 t
// (kerolox density used) -> x0.6605. Stage dry ~4.6 t: Mercury-Redstone 29.9 t and Jupiter-C 29.06 t at liftoff (Wikipedia).
@PART[bluedog_Redstone_FuelTank]:NEEDS[Bluedog_DB]:FINAL // Redstone
{
	@mass += 2.7
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 0.6605
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 0.6605 }
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchLength]]

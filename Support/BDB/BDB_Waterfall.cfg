// Waterfall plumes for BDB Titan engines
// BDB gives the LR-87 AJ-3 (twin and single) and the LR-91 AJ-11 no Waterfall data of their own; they rely on
// the part's base TEMPLATE. Switching variants in the editor can leave the previous variant's plume in place,
// so give them explicit data: kerolox lower for the LR-87 AJ-3, hypergolic upper + hypergolic vernier for the
// LR-91 AJ-11. Positions and scales are the base TEMPLATE values from Bluedog_DB/Compatibility/WaterfallFX/Titan.cfg.
// rescale.cfg scales these subtype TEMPLATEs by 1.6 like the base ones.

@PART[bluedog_LR87]:NEEDS[Bluedog_DB,Waterfall]:AFTER[zzzBluedog_DB]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE[LR87-AJ3]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
				}
				DATA
				{
					TEMPLATE
					{
						templateName = waterfall-kerolox-lower-4
						overrideParentTransform = thrustTransform
						position = 0,0,0.62
						rotation = 0, 0, 0
						scale = 1.3, 1.3, 1.3
					}
				}
			}
		}
	}
}

@PART[bluedog_LR87_Single]:NEEDS[Bluedog_DB,Waterfall]:AFTER[zzzBluedog_DB]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE[LR87-AJ3-Single]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
				}
				DATA
				{
					TEMPLATE
					{
						templateName = waterfall-kerolox-lower-4
						overrideParentTransform = thrustTransform
						position = 0,0,0.695
						rotation = 0, 0, 0
						scale = 1.24, 1.24, 1.24
					}
				}
			}
		}
	}
}

@PART[bluedog_LR91]:NEEDS[Bluedog_DB,Waterfall]:AFTER[zzzBluedog_DB]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		@SUBTYPE[AJ11]
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
					moduleID = LR91
				}
				DATA
				{
					TEMPLATE
					{
						templateName = waterfall-hypergolic-aerozine50-upper-1
						overrideParentTransform = thrustFXTransform
						position = 0,0,0
						rotation = 0, 0, 0
						scale = 0.7, 0.7, 0.8
					}
				}
			}
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleWaterfallFX
					moduleID = LR91_vernier
				}
				DATA
				{
					TEMPLATE
					{
						templateName = waterfall-hypergolic-vernier-upper-1
						overrideParentTransform = vernierFXTransform
						position = 0,0,0.05
						rotation = 0, 0, 0
						scale = 0.72, 0.72, 0.72
					}
				}
			}
		}
	}
}

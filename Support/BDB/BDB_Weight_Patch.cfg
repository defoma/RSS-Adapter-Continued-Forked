
// ---- Crewed capsules (heat shield, ablator, chutes, docking probe and RCS propellant are separate parts/resources) ----
@PART[bluedog_Mercury_Capsule]:NEEDS[Bluedog_DB]:FINAL { @mass = 0.83 } // Hermes M-PRC Personal Reentry Capsule: Mercury capsule ~1,100 kg at landing, less heat shield + ablator, recovery section and nose unit (was 0.47)
@PART[bluedog_Apollo_CrewPod]:NEEDS[Bluedog_DB]:FINAL { @mass = 4.2 } // Kane-11-3 Command Pod: Apollo CM ~5,560 kg, less aft heat shield + ablator (~1.2 t), probe and RCS propellant (was 3)
@PART[bluedog_Apollo_Boilerplate]:NEEDS[Bluedog_DB]:FINAL { @mass = 4.2 } // Kane-SABP1 Command Pod Boilerplate: boilerplate CMs were ballasted to flight CM mass (was 3.25)
@PART[bluedog_LM_Ascent_Cockpit]:NEEDS[Bluedog_DB]:FINAL // Sina-MLEM-ASC Ascent Stage Cockpit: LM ascent stage 2,150 kg dry less APS engine (80 kg, separate part); Orbital subtype offset scaled to match (was 2.5)
{
    @mass = 2.07
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[configSwitch]]
    {
        @SUBTYPE[Orbital]
        {
            @addedMass = -0.973
        }
    }
}


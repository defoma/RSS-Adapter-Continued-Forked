// ---- Launch-vehicle avionics with a well-known mass ----------------------------------
@PART[bluedog_Saturn_S4B_InstrumentUnit]:NEEDS[Bluedog_DB]:FINAL // Sarnus-SIVB-IU Instrument Unit: Saturn IB/V Instrument Unit ~2,000 kg; diameter-variant offsets scaled to match (was 0.5)
{
    @mass = 2.0
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchDiameter]]
    {
        @SUBTYPE[6.25m]
        {
            @addedMass = 0.94
        }
        @SUBTYPE[3.75m]
        {
            @addedMass = -0.24
        }
    }
}


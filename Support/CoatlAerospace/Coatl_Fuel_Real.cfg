
@PART[ca_mer_ft]:NEEDS[CoatlAerospace]:FINAL // CA-MER-FT140: Cassini: 3,000 kg MMH/NTO + 132 kg hydrazine (5,712 kg launch = 2,125 dry + 320 Huygens + 137 adapter + 3,132 propellant)
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 0.3688 // 334 -> 123.19 VU = 3000 kg AZ50/NTO (was 8134 kg)
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 0.3688 }
	}
	@RESOURCE[MonoPropellant]
	{
		@amount = 8.8 // 132 kg (was 60 = 900 kg)
		@maxAmount = 8.8
	}
}

@PART[ca_hera]:NEEDS[CoatlAerospace]:FINAL // CA-602 'Hera': Juno: 1,280 kg hydrazine + 770 kg NTO; 770 kg NTO + 630 kg fuel in the biprop tank, the other 650 kg hydrazine as monopropellant
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 0.3593 // 160 -> 57.49 VU = 1400 kg AZ50/NTO (was 3896 kg)
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 0.3593 }
	}
	@RESOURCE[MonoPropellant]
	{
		@amount = 43.33 // 650 kg (was 35 = 525 kg)
		@maxAmount = 43.33
	}
}

@PART[ca_landv_core]:NEEDS[CoatlAerospace]:FINAL // CA-L100 'Landvermesser' Lander: Surveyor vernier MMH/MON-10: ~70 kg (est. from 995 kg launch - 294 kg landed - 656 kg retromotor)
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@baseVolume *= 0.0958 // 30 -> 2.87 VU = 70 kg AZ50/NTO (was 731 kg)
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 0.0958 }
	}
}


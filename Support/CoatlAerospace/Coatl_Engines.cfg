
@PART[mer_engine]:NEEDS[CoatlAerospace]:AFTER[CoatlAerospace] // R-4D (Cassini main-engine class): R-4D: 490 N, 312 s, 3.63 kg
{
	%real_title = R-4D Bipropellant Engine
	@mass = 0.004 // was 0.08
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 0.49 // was 4
		@PROPELLANT[LiquidFuel] { @name = Aerozine50 }
		@PROPELLANT[Oxidizer] { @name = NTO }
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 312
			key = 1 100
			key = 1.47 0.001
		}
		!UPGRADES {}
	}
}


// Coatl LF/O tanks (converted to B9 by CryoTanks) default to Aerozine50 + NTO, which their engines burn.
@PART[ca_hera,ca_landv_core,ca_landv_orbiter_core,ca_mer_ft,ca_tank_lfo_m,ca_vor_tank]:NEEDS[CoatlAerospace,CryoTanks]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE[AZ50NTO] { %defaultSubtypePriority = 100 }
	}
}

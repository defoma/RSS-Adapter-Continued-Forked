@PART[command-125-landing-1]:FINAL // one switch for tank and RCS: 45 Aerozine50 + 55 NTO (2.2 t) or 90.3 MonoPropellant (1.36 t)
{
	!RESOURCE[MonoPropellant] {}
	!MODULE[ModuleRCSFX]{}

	MODULE
	{
		name = ModuleRCSFX
		stagingEnabled = False
		thrusterTransformName = thrustVector
		thrusterPower = 0.2
		resourceName = MonoPropellant
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		atmosphereCurve
		{
			key = 0 250
			key = 1 120
			key = 4 0.001
		}
		PROPELLANT
		{
			name = Aerozine50
			ratio = 0.9
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 1.1
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
	}

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = fuelSwitch
		switcherDescription = Propellant
		baseVolume = 90.34

		SUBTYPE
		{
			name = AZ50NTO
			title = AZ50+NTO
			tankType = AZ50NTO
			primaryColor = #ba9941
			secondaryColor = #c3d63d
			defaultSubtypePriority = 1
			descriptionDetail = RCS IspVac = 250
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = 0.2
					PROPELLANT
					{
						name = Aerozine50
						ratio = 0.9
						DrawGauge = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					PROPELLANT
					{
						name = NTO
						ratio = 1.1
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 250
						key = 1 120
						key = 4 0.001
					}
				}
			}
		}

		SUBTYPE
		{
			name = MonoPropellant
			title = MonoPropellant
			tankType = MonoPropellant
			primaryColor = #ffffff
			secondaryColor = #ffffff
			descriptionDetail = RCS IspVac = 240
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleRCSFX
				}
				DATA
				{
					thrusterPower = 0.2
					PROPELLANT
					{
						name = MonoPropellant
						ratio = 1
						DrawGauge = True
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 240
						key = 1 100
						key = 4 0.001
					}
				}
			}
		}
	}
}


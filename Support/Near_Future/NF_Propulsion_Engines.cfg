//VASIMR (all rights reserved) or whatever

@PART[vasimr-0625]:NEEDS[NearFuturePropulsion]:AFTER[NearFuturePropulsion] // one VF-200 core: 100 kW, 2.85 N at 5,000 s, 564 kg (est.)
{
	%real_title = VASIMR VF-200 Core (100 kW)
	%real_description = One 100 kW core of Ad Astra's VF-200 flight engine. A helicon antenna ionizes argon and ion cyclotron heating accelerates it: 2.85 N at 5,000 s, with Isp traded against thrust.
	@mass = 0.564 // was 0.35
	@MODULE[ModuleEnginesFX]:HAS[#engineID[ArgonMode]]
	{
		@PROPELLANT[ElectricCharge] { @ratio = 2.383489 }
		@atmosphereCurve
		{
			@key,0 = 0 5000
			@key,1 = 1 50
		}
	}
	@MODULE[ModuleEnginesFX]:HAS[#engineID[XenonMode]]
	{
		@PROPELLANT[ElectricCharge] { @ratio = 52.553722 }
		@atmosphereCurve
		{
			@key,0 = 0 3333
			@key,1 = 1 33.33
		}
	}
	@MODULE[VariableISPEngine]
	{
		@VARIABLEISPMODE[*],*
		{
			@IspThrustCurve { @key,*[0, ] *= 0.833333 }
		}
	}
}


@PART[ionEngine]:NEEDS[NearFuturePropulsion]:AFTER[NearFuturePropulsion] // NSTAR (IX-6315 "Dawn")
{
	@mass = 0.0082
	@MODULE[ModuleEngine*]
	{
		@maxThrust = 2
		@heatProduction = 0
		@PROPELLANT[XenonGas] { @ratio = 0.1 }
		@PROPELLANT[ElectricCharge] { @ratio = 1.3286 }
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 3100
			key = 1 100
			key = 1.2 0.001
		}
	}
}


//Tanks

@PART[xenon-125-*,xenon-25-*,xenon-radial-*]:NEEDS[NearFuturePropulsion]:AFTER[NearFuturePropulsion] // PB-XA / PB-Z / PB-XR
{
	@mass *= 1.6
	@RESOURCE[XenonGas]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

@PART[argon-0625-*,argon-125-*,argon-25-*,argon-radial-*]:NEEDS[NearFuturePropulsion]:AFTER[NearFuturePropulsion] // ARK / ARH / ARG / A10x
{
	@mass *= 1.6
	@RESOURCE[ArgonGas]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

@PART[lithium-0625-*,lithium-125-*,lithium-25-*,lithium-radial-*]:NEEDS[NearFuturePropulsion]:AFTER[NearFuturePropulsion] // LFT / LFR
{
	@mass *= 1.6
	@RESOURCE[Lithium]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

@B9_TANK_TYPE[Xenon]:NEEDS[B9PartSwitch]:FINAL // 15.75 -> 64.51 units/VU
{
	@tankMass *= 1.6
	@RESOURCE[XenonGas] { @unitsPerVolume *= 4.096 }
}
@B9_TANK_TYPE[Argon]:NEEDS[B9PartSwitch]:FINAL // 1,000 -> 4,096 units/VU
{
	@tankMass *= 1.6
	@RESOURCE[ArgonGas] { @unitsPerVolume *= 4.096 }
}
@B9_TANK_TYPE[Lithium]:NEEDS[B9PartSwitch]:FINAL // 5 -> 20.48 units/VU
{
	@tankMass *= 1.6
	@RESOURCE[Lithium] { @unitsPerVolume *= 4.096 }
}

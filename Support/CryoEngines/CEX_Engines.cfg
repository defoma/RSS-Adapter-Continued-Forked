
@PART[CEX_LHD_Hestia]:AFTER[CryoEnginesExtensions] // YF-75 class (gas generator, upper stage)
{
	@mass = 0.55 // YF-75: 78.45 kN vac, 438 s, 550 kg; vacuum nozzle
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 78.45
		@atmosphereCurve
		{
			!key,* = DEL
			key = 0 438
			key = 1 100
			key = 1.3 0.001
		}
	}
}


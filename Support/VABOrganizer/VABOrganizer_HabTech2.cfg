// HabTech2: parts its own VABO_ht2 patch leaves without a subcategory (2026-10-25)
@PART[ht2_ELC|ht2_ESP|ht2_JEM_EF]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = trusses }
}

@PART[ht2_MBS|ht2_MT]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = trussAdapters }
}

@PART[ht2_questPod|ht2_ATA]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = monoprop }
}

@PART[ht2_JEM_armMount]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = radialAdapters }
}

@PART[ht2_bipod_strut]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = girders }
}

@PART[Garage|GarageMini]:NEEDS[VABOrganizer,HabTech2]:AFTER[VABOrganizer]
{
	%VABORGANIZER { %organizerSubcategory = cargoBays }
}

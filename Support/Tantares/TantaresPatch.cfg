//Waterfall, Created by Globul

@PART[octans_basic_rcs_srf_*,octans_moe_srf_*,*_linear_srf_1,rotanev_rcs_srf_1,eridani_rcs_linear_srf_2,octans_rcs_srf_*]:NEEDS[Waterfall]:FINAL // monoTransform
{

	!EFFECTS {}
	!MODULE[ModuleWaterfallFX] {}

	EFFECTS
	{
		running
		{
			AUDIO_MULTI_POOL
			{
				channel = Ship
				transformName = monoTransform
				clip = Waterfall/Sounds/Beale_Sounds/Sound_RocketStentor
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.04
				volume = 1.0 0.15
				pitch = 1.5
				loop = true
			}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		// This is a custom name
		moduleID = RCSBlockFX
		// This links the effects to a given ModuleEngines
		engineID = basicEngine

		// List out all controllers we want available
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = rcs
			linkedTo = rcs
			responseRateUp = 0.7
			responseRateDown = 0.7
		}
		CONTROLLER
		{
			name = R1
			linkedTo = random
			noiseType = perlin
			scale = 1
			minimum = 0
			speed = 12
			seed = 1
		}
		TEMPLATE
		{
			// This is the name of the template to use
			templateName = stock-rcs-jet-3
			// This field allows you to override the parentTransform name in the EFFECTS contained in the template
			overrideParentTransform = monoTransform
			position = 0,0,0
			rotation = 0, 0, 180
			scale = 0.8, 0.5, 0.5
		}
	}
}


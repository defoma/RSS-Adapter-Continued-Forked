
//Resistojets

@PART[rj_engine_small]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // MR-501B EHT: 0.37 N, 303 s, 493 W, ~0.8 kg (est.)
{
	%real_title = MR-501B Electrothermal Hydrazine Thruster
	%real_description = Aerojet's resistojet: a catalytic hydrazine thruster with an electric heater that superheats the exhaust, raising Isp from about 230 s to 303 s. 0.37 N on 493 W. Flown on Iridium and many GEO satellites.
	@mass = 0.0008 // was 0.03
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[MonoPropellant] { @ratio = 0.033654 } // keeps SEE's 0.8 EC/s
		@atmosphereCurve
		{
			@key,0 = 0 303
			@key,1 = 1 171
		}
	}
}

@PART[rj_engine_big]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // MR-502A IMPEHT: 0.80 N, 303 s, 885 W, 0.87 kg
{
	%real_title = MR-502A Improved Electrothermal Hydrazine Thruster
	%real_description = Aerojet's improved resistojet (IMPEHT): 0.36-0.80 N of superheated hydrazine at 294-303 s, drawing 610-885 W. A 0.87 kg thruster rated for 525,000 N-s.
	@mass = 0.00087 // was 0.14
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[MonoPropellant] { @ratio = 0.036058 } // keeps SEE's 2.8 EC/s
		@atmosphereCurve
		{
			@key,0 = 0 303
			@key,1 = 1 171
		}
	}
}

@PART[SEE_rj_rcs]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // MR-501B-class nozzles: 303 s; mass SEE's
{
	%real_title = Electrothermal Hydrazine RCS Thruster
	%real_description = MR-501B-class resistojet nozzles as an RCS block, in several arrangements: heated hydrazine at 303 s.
	@MODULE[ModuleRCSFX]
	{
		@PROPELLANT[MonoPropellant] { @ratio = 0.033654 } // keeps SEE's 0.4 EC/s per nozzle
		@atmosphereCurve
		{
			@key,0 = 0 303
			@key,1 = 1 171
		}
	}
}

//Arcjets

@PART[KO-A1_Teacake]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // MR-509: 254 mN, 502 s, 1.78 kW, arcjet 1.4 kg, 866,500 N-s life
{
	%real_title = MR-509 Hydrazine Arcjet
	%real_description = Aerojet's first flight arcjet (Telstar 401): an electric arc heats decomposed hydrazine to 502 s. 254 mN on 1.78 kW. Electrode wear limits it to about 866,500 N-s of total impulse.
	@mass = 0.0014 // was 0.15
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[MonoPropellant] { @ratio = 0.0093049 } // keeps SEE's 8 EC/s
		@PROPELLANT[Ablator] { @ratio = 0.0000792971 } // 0.1 units per 11.73 MonoPropellant (176 kg)
		@atmosphereCurve
		{
			@key,0 = 0 502
			@key,1 = 1 270
		}
	}
	@RESOURCE[Ablator]
	{
		@amount = 0.1
		@maxAmount = 0.1
	}
}

@PART[KO-A2_Gumdrop]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // MR-510: 258 mN, 585 s, 2.2 kW, arcjet 1.6 kg, 1,450,000 N-s life
{
	%real_title = MR-510 Hydrazine Arcjet
	%real_description = Aerojet's 2 kW arcjet for Lockheed Martin A2100 satellites: 585-615 s at 222-258 mN on 2.2 kW. Rated for 1,450,000 N-s of total impulse.
	@mass = 0.0016 // was 0.65
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[MonoPropellant] { @ratio = 0.0067156 } // keeps SEE's 32 EC/s
		@PROPELLANT[Ablator] { @ratio = 0.0000398549 } // 0.1 units per 16.85 MonoPropellant (253 kg)
		@atmosphereCurve
		{
			@key,0 = 0 585
			@key,1 = 1 309
		}
	}
	@RESOURCE[Ablator]
	{
		@amount = 0.1
		@maxAmount = 0.1
	}
}

//Pulsed plasma thrusters

@PART[PPT_22]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // LES-8/9 PPT: 300 uN-s at 2.2 Hz = 0.66 mN, 1,000 s, ~44 W, 7.5 kg with ~0.97 kg Teflon
{
	%real_title = LES-8/9 Pulsed Plasma Thruster
	%real_description = MIT Lincoln Laboratory's PPT: a 20 J capacitor discharge ablates a bar of Teflon 2.2 times a second, for 0.66 mN at 1,000 s. Its non-replenishable Teflon bar lasts about 34 million pulses.
	@mass = 0.0065 // was 0.06
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[SolidFuel] { @ratio = 0.0101972 } // keeps SEE's 1.6 EC/s
		@atmosphereCurve
		{
			@key,0 = 0 1000
			@key,1 = 1 50
		}
	}
	@RESOURCE[SolidFuel] // 0.97 kg Teflon: 28.5 ug per pulse over the 34 million qualified pulses
	{
		@amount = 0.1293
		@maxAmount = 0.1293
	}
}

@PART[PPT_33]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // EO-1 PRS-101 (thruster pair): 1.24 mN at 100 W, 1,350 s, 4.74 kg dry, 15,600 N-s
{
	%real_title = PRS-101 Pulsed Plasma Thruster
	%real_description = The Teflon PPT pair flown on NASA's Earth Observing-1, with integral power electronics. Up to 1.24 mN at 1,350 s on 100 W, and 15,600 N-s from its Teflon bars.
	@mass = 0.00474 // was 0.135
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[SolidFuel] { @ratio = 0.0075535 } // keeps SEE's 3.6 EC/s
		@atmosphereCurve
		{
			@key,0 = 0 1350
			@key,1 = 1 67.5
		}
	}
	@RESOURCE[SolidFuel] // 1.18 kg Teflon = 15,600 N-s at 1,350 s
	{
		@amount = 0.1571
		@maxAmount = 0.1571
	}
}

//Field-emission

@PART[SEE_FEEP_engine]:NEEDS[SupplementaryElectricEngines]:AFTER[SupplementaryElectricEngines] // Centrospazio FEEP-50 (caesium): 1.4 mN, 9,000 s; no published mass, SEE's kept
{
	%real_title = FEEP-50 Caesium Field-Emission Thruster
	%real_description = Centrospazio's slit-emitter FEEP: liquid caesium wicks to a sharp edge where a strong electric field pulls ions straight off the metal. Up to 1.4 mN at 9,000 s.
	@MODULE[ModuleEngines*]
	{
		@PROPELLANT[Caesium] { @ratio = 0.000085390 } // keeps SEE's 55 EC/s
		@atmosphereCurve
		{
			@key,0 = 0 9000
			@key,1 = 1 9
		}
	}
}

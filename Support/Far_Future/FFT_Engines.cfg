	@mass = 119 // was 18
	@MODULE[ModuleEnginesFX]:HAS[#engineID[FissionPulse]]
	{
		@maxThrust = 642 // was 640
		@atmosphereCurve { @key,0 = 0 9497 }
	}
}

@PART[fft-nswr-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Zubrin NSWR, 2% UTB at 20% U-235: 12.9 MN, 6,728 s, 33 t engine
{


//Fission

@PART[fft-fission-orion-5-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Orion, USAF 10 m (General Atomics): 2,000 kN, 3,354 s, 107.9 t engine
{
	%real_title = Orion 10 m Nuclear Pulse Propulsion Module
	%real_description = General Atomics' 10-metre Orion, studied for the US Air Force: low-yield nuclear charges detonated behind a pusher plate on shock absorbers. 2,000 kN at 3,354 s. Don't fire it near anything you care about.
	@mass = 107.9 // was 56
	@MODULE[ModuleEnginesFX]:HAS[#engineID[FissionPulse]]
	{
		@maxThrust = 2000 // was 5000
		@atmosphereCurve
		{
			@key,0 = 0 3354
			@key,1 = 1 3354
		}
	}
}

@PART[fft-fission-zpinch-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Mini-Mag Orion DRM-1 (MSFC): 642 kN, 9,497 s, 119 t engine
{
	%real_title = Mini-Mag Orion (DRM-1)

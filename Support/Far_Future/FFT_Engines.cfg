@PART[fft-fusion-inertial-magnetic-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Slough Fusion Driven Rocket (MSNW, NIAC 2012): lithium liners, 5,140 s, 13.8 kN high gear

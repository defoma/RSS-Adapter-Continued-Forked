@PART[fft-ffre-plasma-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Werka AFFRE (NASA NIAC): FFRE 527,013 s / AFFRE 32,000 s; 269 t engine incl. 91 t moderator oil
{
	%real_title = Werka Afterburning Fission Fragment Rocket (AFFRE)
	%real_description = Robert Werka's NASA NIAC design: a dusty plasma of fissioning nanoparticles held in a moderator, with fragments leaving at 527,013 s. The afterburner mode injects hydrogen into the fragment stream for 32,000 s at much higher thrust.
	@mass = 269 // was 18
	@MODULE[ModuleEnginesFX]:HAS[#engineID[FissionFragment]]
	{
		// real thrust 43 N: see Extras/RealFFTThrust.cfg.ban
		@atmosphereCurve { @key,0 = 0 527013 }
	}
	@MODULE[ModuleEnginesFX]:HAS[#engineID[Afterburning]]
	{
		// real thrust 4,651 N: see Extras/RealFFTThrust.cfg.ban
		@PROPELLANT[LqdHydrogen] { @ratio = 413.08 } // AFFRE: 0.0179 kg/s H2 per 3.12e-5 kg/s fragments (574:1 by mass)
		@atmosphereCurve { @key,0 = 0 32000 }
	}
}


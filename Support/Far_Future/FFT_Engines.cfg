@PART[fft-fusion-magnetic-mirror-1]:NEEDS[FarFutureTechnologies]:AFTER[FarFutureTechnologies] // Kammash gasdynamic mirror (GDM): 47 kN at 199,796 s
{
	%real_title = Gasdynamic Mirror Fusion Engine (GDM)
	%real_description = Terry Kammash's gasdynamic mirror: a long, thin, dense plasma that fuses as it leaks out one end. The full-length chamber gives 47 kN at about 200,000 s; shorter chambers trade both away. Hydrogen injection raises thrust. Charge its power banks before activating.
	// FFT's longest chamber (Size4) already has the GDM's ~200,000 s, so the Isp of every length stays FFT's.
	// Thrust is scaled by 47/375 in every length and mode. Mass FFT's.
	@MODULE[ModuleEnginesFX]:HAS[#engineID[ReactionProducts]] { @maxThrust = 9.4 }
	@MODULE[ModuleEnginesFX]:HAS[#engineID[Afterburner]]
	{
		@maxThrust = 47
		@PROPELLANT[LqdHydrogen] { @ratio = 7.085 } // FFT's mix by mass
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[lengthSwitch]]
	{
		@SUBTYPE[Size0]
		{
			@MODULE,0 { @DATA { @maxThrust = 9.4 } }	// was 75
			@MODULE,1 { @DATA { @maxThrust = 47 } }		// was 375
		}
		@SUBTYPE[Size1]
		{
			@MODULE,0 { @DATA { @maxThrust = 18.8 } }	// was 150
			@MODULE,1 { @DATA { @maxThrust = 94 } }		// was 750
		}
		@SUBTYPE[Size2]
		{
			@MODULE,0 { @DATA { @maxThrust = 28.2 } }	// was 225
			@MODULE,1 { @DATA { @maxThrust = 141 } }	// was 1125
		}
		@SUBTYPE[Size3]
		{
			@MODULE,0 { @DATA { @maxThrust = 37.6 } }	// was 300
			@MODULE,1 { @DATA { @maxThrust = 188 } }	// was 1500
		}
		@SUBTYPE[Size4]
		{
			@MODULE,0 { @DATA { @maxThrust = 47 } }		// was 375
			@MODULE,1 { @DATA { @maxThrust = 235 } }	// was 1875
		}
	}
}


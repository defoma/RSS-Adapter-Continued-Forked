
@B9_TANK_TYPE[NuclearSaltWater]:NEEDS[FarFutureTechnologies]:FINAL // 2% UTB solution, ~1,050 kg/m^3 = 21.5 kg/VU
{
	@tankMass *= 1.6
	@RESOURCE[NuclearSaltWater] { @unitsPerVolume = 20.48 }
}
@B9_TANK_TYPE[FissionParticles]:NEEDS[FarFutureTechnologies]:FINAL
{
	@tankMass *= 1.6
	@RESOURCE[FissionParticles] { @unitsPerVolume = 0.4096 }
}
@B9_TANK_TYPE[Deuterium]:NEEDS[FarFutureTechnologies]:FINAL // 162 kg/m^3 = 3.33 kg/VU
{
	@tankMass *= 1.6
	@RESOURCE[LqdDeuterium] { @unitsPerVolume = 20.48 }
}
@B9_TANK_TYPE[He3]:NEEDS[FarFutureTechnologies]:FINAL // 59 kg/m^3 = 1.21 kg/VU
{
	@tankMass *= 1.6
	@RESOURCE[LqdHe3] { @unitsPerVolume = 20.48 }
}
@B9_TANK_TYPE[DeuteriumHe3]:NEEDS[FarFutureTechnologies]:FINAL // D : He3 = 1 : 4 by units, FFT's fusion mix
{
	@tankMass *= 1.6
	@RESOURCE[LqdDeuterium] { @unitsPerVolume = 4.096 }
	@RESOURCE[LqdHe3] { @unitsPerVolume = 16.384 }
}
@B9_TANK_TYPE[FissionPellets]:NEEDS[FarFutureTechnologies]:FINAL
{
	@tankMass *= 1.6
	@RESOURCE[FissionPellets] { @unitsPerVolume = 4.096 }
}
@B9_TANK_TYPE[FusionPellets]:NEEDS[FarFutureTechnologies]:FINAL
{
	@tankMass *= 1.6
	@RESOURCE[FusionPellets] { @unitsPerVolume = 20.48 }
}

@PART[fft-fueltank-fusion-*]:NEEDS[FarFutureTechnologies]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[fuelSwitch]]
	{
		@SUBTYPE,*:HAS[#addedMass[*]] { @addedMass *= 1.6 }
	}
}

@PART[fft-fueltank-lithium-*]:NEEDS[FarFutureTechnologies]:FINAL // solid lithium, 534 kg/m^3
{
	@mass *= 1.6
	@RESOURCE[Lithium]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

@PART[fft-fueltank-targets-*]:NEEDS[FarFutureTechnologies]:FINAL // fission pellet magazines
{
	@mass *= 1.6
	@RESOURCE[FissionPellets]
	{
		@amount *= 4.096
		@maxAmount *= 4.096
	}
}

// length subtypes keep their share of the new mass
@PART[ht2_radiatorSingle]:NEEDS[HabTech2]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[length]]
	{
		@SUBTYPE,*:HAS[#addedMass[*]]
		{
			@addedMass *= 2.8 // 1.12 / 0.4
		}
	}
}
@PART[ht2_SAW_radiator]:NEEDS[HabTech2]:FINAL
{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[length]]
	{
		@SUBTYPE,*:HAS[#addedMass[*]]
		{
			@addedMass *= 3.75 // 0.75 / 0.2
		}
	}
}

// HabTech sized these loads for stock MonoPropellant (4 kg/unit, 1 t). The Adapter uses 15 kg/unit, so 250 units
// weighed 3.75 t; 66.667 units keeps the intended 1 t of hydrazine.
@PART[ht2_fuelModule,ht2_propModule]:NEEDS[HabTech2]:FINAL
{
	@RESOURCE[MonoPropellant]
	{
		@amount = 66.667
		@maxAmount = 66.667
	}
}

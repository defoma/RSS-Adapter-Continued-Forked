@PART[MEMLander] // Munar Excursion Module (M.E.M.)
{

	@MODULE[ModuleRCSFX]
	{
		!PROPELLANT[MonoPropellant]{}
		PROPELLANT
		{
			name = Aerozine50
			ratio = 0.45
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.55
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
	}

	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}

	RESOURCE
	{
		name = Aerozine50
		amount = 45
		maxAmount = 45
	}
	RESOURCE
	{
		name = NTO
		amount = 55
		maxAmount = 55
	}
}


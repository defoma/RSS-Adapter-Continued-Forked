//Hypergolic

@PART[syl-rcs-1,syl-rcs-2]:AFTER[SpaceY]
{
	%Thrust = #$/MODULE[ModuleRCSFX]/thrusterPower$

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = RCS
		switchInFlight = True

		SUBTYPE
		{
			name = AZ50
			title = Aerozine50 + NTO
			primaryColor = #ba9941
			secondaryColor = #c3d63d
			descriptionDetail = IspVac = 300
			MODULE
			{
				IDENTIFIER { name = ModuleRCSFX }
				DATA
				{
					thrusterPower = #$/Thrust$
					PROPELLANT
					{
						name = Aerozine50
						ratio = 0.45
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					PROPELLANT
					{
						name = NTO
						ratio = 0.55
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 300
						key = 1 100
						key = 8 0.001
					}
				}
			}
		}
		SUBTYPE
		{
			name = MonoPropellant
			title = MonoPropellant
			primaryColor = #ffffff
			secondaryColor = #ffffff
			descriptionDetail = IspVac = 240
			MODULE
			{
				IDENTIFIER { name = ModuleRCSFX }
				DATA
				{
					thrusterPower = #$/Thrust$
					PROPELLANT
					{
						name = MonoPropellant
						ratio = 1
						resourceFlowMode = STAGE_PRIORITY_FLOW
					}
					atmosphereCurve
					{
						key = 0 240
						key = 1 100
						key = 8 0.001
					}
				}
			}
		}
	}
}


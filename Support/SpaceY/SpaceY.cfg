//SRBs

@PART[syl-srb-*,syl-ejectatron,syl-decoupler5m,syl-decouplerRadial1,syl-decouplerRadial2,syx-decoupler-750,syx-decoupler-1000]:HAS[@RESOURCE[SolidFuel]]:AFTER[SpaceY]
{
	@MODULE,*:HAS[#name[ModuleEngines*],@PROPELLANT[SolidFuel]]
	{
		@maxThrust *= 4.45
	}
	@RESOURCE[SolidFuel]
	{
		@amount *= 4.1
		@maxAmount *= 4.1
	}
}


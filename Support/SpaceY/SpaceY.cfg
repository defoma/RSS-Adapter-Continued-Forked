@PART[syl-eng-125-K1]:AFTER[SpaceY] // Merlin 1C (K1 "Kiwi")
{
	%real_title = Merlin 1C
	%real_description = The first regeneratively cooled Merlin, flown on Falcon 1 and the first Falcon 9 (v1.0). Gas-generator cycle, RP-1/LOX, pintle injector.
	@mass = 0.63
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 615
		@atmosphereCurve
		{
			@key,0 = 0 304
			@key,1 = 1 275
		}
	}
}

@PART[syl-eng-250-M1]:AFTER[SpaceY] // Merlin 1D (M1 "Moa")
{
	%real_title = Merlin 1D
	%real_description = SpaceX's workhorse booster engine. Gas-generator cycle, RP-1/LOX, deep throttling and restartable for propulsive landing. Comes with both conical adapter fairings (pick one of the two lower nodes).
	@mass = 0.47
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 914
		@atmosphereCurve
		{
			@key,0 = 0 311
			@key,1 = 1 282
		}
	}
}

@PART[syl-eng-500-M5]:AFTER[SpaceY] // 5x Merlin 1D (M5 "Multi-Moa")
{
	%real_title = 5x Merlin 1D
	%real_description = Five Merlin 1D engines on one thrust structure, the layout of the never-flown Falcon 5. The mode switch shuts the centre engine down.
	@mass = 2.7
	@MODULE[ModuleEngines*]:HAS[#engineID[AllEngines]]
	{
		@maxThrust = 4570
	}
	@MODULE[ModuleEngines*]:HAS[#engineID[CenterOff]] // outer four
	{
		@maxThrust = 3656
	}
	@MODULE[ModuleEngines*],*
	{
		@atmosphereCurve
		{
			@key,0 = 0 311
			@key,1 = 1 282
		}
	}
}


//Methalox

@PART[syl-eng-250-R1]:AFTER[SpaceY] // Raptor 2 (R1 "Ratite")
{
	%real_title = Raptor 2
	%real_description = Full-flow staged combustion methalox engine powering Super Heavy and Starship. Runs on LqdMethane + LqdOxygen.
	@mass = 1.63
	@MODULE[ModuleEngines*]
	{
		@maxThrust = 2415
		@PROPELLANT[LiquidFuel]


@PART:HAS[@MODULE[ProceduralFairingSide]]:NEEDS[ProceduralFairings]:AFTER[ProceduralFairings]
{
	@MODULE[ProceduralFairingSide]
	{
		%density = 0.05
		%minDensity = 0.02
		%maxDensity = 1.0
		%stepDensity = 0.001
	}
}

@PART:HAS[@MODULE[ProceduralFairingBase]]:NEEDS[ProceduralFairings]:AFTER[ProceduralFairings]
{
	@MODULE[ProceduralFairingBase]:HAS[#mode[Payload]]
	{
		@specificMass = 0.0002, 0.01, 0.005, 0
		%decouplerMassMult = 4
		%decouplerMassBase = 0
	}
	@MODULE[ProceduralFairingBase]:HAS[#mode[Adapter]]
	{
		@specificMass = 0.0002, 0.0075, 0.005, 0
		%decouplerMassMult = 4
		%decouplerMassBase = 0
	}
}
